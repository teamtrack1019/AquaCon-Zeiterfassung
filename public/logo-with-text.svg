<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Circular Badge -->
  <circle cx="120" cy="120" r="95" fill="url(#logoBlueGrad)" filter="url(#logoShadow)" />
  <g fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="120" y="105" font-size="46" letter-spacing="1">Aqua</text>
    <text x="120" y="155" font-size="46" letter-spacing="1">Con</text>
  </g>
  <!-- Brand Text -->
  <text x="250" y="115" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="1">AquaCon</text>
  <text x="250" y="160" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="2">Zeiterfassung</text>
</svg>
